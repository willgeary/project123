[project]
name = "vi-assignment"
version = "0.1.0"
description = "Take-home assignment submission."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
bayes = [
    "arviz>=1.3.0",
    "nutpie>=0.16.11",
    "pymc>=6.3.2",
]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "assignment"

[tool.ruff]
line-length = 120
include = ["main.py", "assignment/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E731: short named lambdas are deliberate one-line helpers. E501: long user-facing strings are left whole.
ignore = ["E731", "E501"]
